<svg xmlns="http://www.w3.org/2000/svg" width="1498" height="898" viewBox="0 -6 1498 898" role="img" aria-label="How irx.bootstrap finds a pinned LLVM, and why it refuses the wrong one">
  <title>How irx.bootstrap finds a pinned LLVM, and why it refuses the wrong one</title>
  <defs><marker id="head-source" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/></marker><marker id="head-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6741d9"/></marker><marker id="head-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/></marker><marker id="head-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker><marker id="head-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8590c"/></marker><marker id="head-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
  <rect x="0" y="-6" width="1498" height="898" fill="#ffffff"/>
  <text x="40" y="48.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">irx.bootstrap() tries these in order and stops at the first one that answers</text>
  <rect x="40" y="90" width="560" height="64" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="320.0" y="118.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle" xml:space="preserve">IRX_LLVM_BIN</text>
  <text x="320.0" y="135.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle" xml:space="preserve">you pointed at one yourself, so nothing else gets a vote</text>
  <line x1="604" y1="122.0" x2="634" y2="122.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="40" y="174" width="560" height="64" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="320.0" y="202.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle" xml:space="preserve">~/.cache/irx/&lt;tag&gt;/bin</text>
  <text x="320.0" y="219.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle" xml:space="preserve">already unpacked from an earlier cell, so this is free</text>
  <line x1="604" y1="206.0" x2="634" y2="206.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="40" y="258" width="560" height="64" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="320.0" y="286.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle" xml:space="preserve">your llvm-project build tree</text>
  <text x="320.0" y="303.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle" xml:space="preserve">E1 only, and it is the one you just built</text>
  <line x1="604" y1="290.0" x2="634" y2="290.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="40" y="342" width="560" height="64" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="320.0" y="370.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle" xml:space="preserve">the LLVM already on PATH</text>
  <text x="320.0" y="387.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle" xml:space="preserve">convenient, and quite often the wrong version</text>
  <line x1="604" y1="374.0" x2="634" y2="374.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="40" y="426" width="560" height="64" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
  <text x="320.0" y="454.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6741d9" text-anchor="middle" xml:space="preserve">the pinned tarball we publish</text>
  <text x="320.0" y="471.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6741d9" text-anchor="middle" xml:space="preserve">the Colab path: one download, unpacked in seconds</text>
  <line x1="604" y1="458.0" x2="634" y2="458.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="40" y="510" width="560" height="64" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
  <text x="320.0" y="538.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" xml:space="preserve">apt.llvm.org</text>
  <text x="320.0" y="555.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" xml:space="preserve">minutes rather than seconds, and only until the tarball exists</text>
  <line x1="604" y1="542.0" x2="634" y2="542.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <text x="40" y="613.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nothing there? fall through to the next one</text>
  <polyline points="640,122.0 640,640 730,640" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-plain)"/>
  <text x="740" y="109.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The order is the design, not a preference.</text>
  <text x="740" y="125.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve"></text>
  <text x="740" y="141.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Cheap and certain first, slow and uncertain last, so the common case</text>
  <text x="740" y="157.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">is a cache hit and nobody waits.</text>
  <text x="740" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve"></text>
  <text x="740" y="190.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Wrong major version is not the same as failure. A machine with some</text>
  <text x="740" y="206.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">other LLVM already on PATH goes back to the list and carries on down</text>
  <text x="740" y="222.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">it, and ends up downloading the pinned tarball. The one thing that</text>
  <text x="740" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">does stop here is IRX_LLVM_BIN pointing at the wrong version, because</text>
  <text x="740" y="255.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">somebody set that on purpose and deserves to be told.</text>
  <text x="740" y="271.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve"></text>
  <text x="740" y="287.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Whichever one answers, its name gets printed. If a bootstrap takes</text>
  <text x="740" y="304.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">four minutes, the line above the lesson says apt.llvm.org and you</text>
  <text x="740" y="320.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">know why, rather than guessing that Colab is slow today.</text>
  <rect x="734" y="608" width="300" height="64" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
  <text x="884.0" y="636.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6741d9" text-anchor="middle" xml:space="preserve">is this the major version</text>
  <text x="884.0" y="653.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6741d9" text-anchor="middle" xml:space="preserve">everything is written against?</text>
  <line x1="1038" y1="640" x2="1094" y2="640" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <text x="1066" y="624.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">yes</text>
  <rect x="1098" y="612" width="360" height="56" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="1278.0" y="636.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f9e44" text-anchor="middle" xml:space="preserve">irx: LLVM 23.1.0 from the pinned</text>
  <text x="1278.0" y="652.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f9e44" text-anchor="middle" xml:space="preserve">tarball, ready in 21.4s</text>
  <polyline points="884,676 884,706 710,706 710,736" fill="none" stroke="#495057" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-external)"/>
  <rect x="560" y="740" width="300" height="60" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="710.0" y="766.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle" xml:space="preserve">back to the list, and try</text>
  <text x="710.0" y="782.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle" xml:space="preserve">the next source down</text>
  <text x="590" y="694.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">no, and nobody asked for this one</text>
  <polyline points="884,676 884,706 1050,706 1050,736" fill="none" stroke="#e8590c" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-warn)"/>
  <rect x="900" y="740" width="300" height="60" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
  <text x="1050.0" y="766.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" xml:space="preserve">ToolchainError naming the version</text>
  <text x="1050.0" y="782.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" xml:space="preserve">it found and how to fix it</text>
  <text x="908" y="694.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">no, but IRX_LLVM_BIN asked for it</text>
  <text x="560" y="833.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The split matters. A Colab box with somebody else's LLVM on PATH should go and fetch the right one,</text>
  <text x="560" y="849.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">not refuse to start. A person who set IRX_LLVM_BIN by hand should hear about it, not be ignored.</text>
</svg>
