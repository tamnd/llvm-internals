<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="492" viewBox="-40 -30 1150 492" role="img" aria-label="How a lesson becomes a notebook a reader can open in Colab">
  <title>How a lesson becomes a notebook a reader can open in Colab</title>
  <defs><marker id="head-source" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/></marker><marker id="head-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6741d9"/></marker><marker id="head-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/></marker><marker id="head-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker><marker id="head-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8590c"/></marker><marker id="head-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
  <rect x="-40" y="-30" width="1150" height="492" fill="#ffffff"/>
  <text x="0" y="58.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">you edit this</text>
  <rect x="0" y="100" width="230" height="78" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="115.0" y="134.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1971c2" text-anchor="middle" xml:space="preserve">lessons/t04/</text>
  <text x="115.0" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1971c2" text-anchor="middle" xml:space="preserve">lesson.py</text>
  <rect x="300" y="100" width="180" height="78" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
  <text x="390.0" y="134.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6741d9" text-anchor="middle" xml:space="preserve">build.py</text>
  <text x="390.0" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6741d9" text-anchor="middle" xml:space="preserve">notebooks</text>
  <text x="550" y="58.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generated, never edited by hand</text>
  <rect x="550" y="100" width="250" height="78" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="675.0" y="134.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve">notebooks/t04/</text>
  <text x="675.0" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2f9e44" text-anchor="middle" xml:space="preserve">lesson.ipynb</text>
  <text x="870" y="58.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">what a reader clicks</text>
  <rect x="870" y="100" width="200" height="78" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="970.0" y="134.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve">Colab, from the</text>
  <text x="970.0" y="153.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle" xml:space="preserve">badge in the README</text>
  <line x1="230" y1="139" x2="295" y2="139" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <line x1="480" y1="139" x2="545" y2="139" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <line x1="800" y1="139" x2="865" y2="139" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-plain)"/>
  <rect x="300" y="300" width="180" height="70" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
  <text x="390.0" y="340.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6741d9" text-anchor="middle" xml:space="preserve">build.py check</text>
  <polyline points="115,178 115,335 295,335" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-plain)"/>
  <polyline points="675,178 675,335 485,335" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-plain)"/>
  <text x="300" y="403.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Rebuilds the notebook in memory and compares bytes.</text>
  <text x="300" y="419.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Different means somebody edited the generated file, and CI fails.</text>
  <polyline points="1030,100 1030,10 115,10 115,96" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#head-warn)"/>
  <text x="542" y="-6.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e8590c" text-anchor="middle" xml:space="preserve">found a bug in Colab? fix it in the .py, not in the notebook</text>
</svg>
