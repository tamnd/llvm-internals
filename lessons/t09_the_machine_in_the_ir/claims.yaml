# Every factual claim in this lesson, with the evidence for it.
# confidence is one of: observed, cited, inferred. At most three may be inferred.
#
# Everything marked observed was checked on two platforms, macOS arm64 with
# Homebrew LLVM 23.1.0 and Linux x86_64 running the min bundle's own clang, opt
# and lli built from llvmorg-23.1.0. This is the lesson where the two platforms
# stop disagreeing about numbers, because every module is compiled for a named
# target rather than for the host, so both hosts produce all four sets. The one
# thing that does differ is that the min bundle's opt was built without the ARM
# backend and says so on stderr for the thumb module, which is its own claim
# below. The wasm definitions say hidden rather than dso_local on both hosts,
# which is clang's doing and not the host's.
claims:
  - id: four-targets-four-layouts
    claim: One line of C compiled for x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, thumbv7m-none-eabi and wasm32-unknown-unknown produces four different target datalayout strings, differing in pointer width, integer alignments, stack alignment and the list of native integer widths.
    evidence: cell two_headers
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same four strings on both
    confidence: observed

  - id: the-layout-is-the-module-s
    claim: The data layout is a property of the module, written into the file as a string, rather than something recomputed by each consumer of the IR.
    evidence: cell two_headers
    citation: llvm/docs/LangRef.md:3447-3453@llvmorg-23.1.0, "A module may specify a target-specific data layout string that specifies how data is to be laid out in memory", with the syntax target datalayout = "layout specification"
    confidence: cited

  - id: the-triple-is-the-module-s-too
    claim: The target triple is likewise a string in the module, of the form architecture-vendor-operating system with an optional environment.
    evidence: cells two_headers and the_triple_alone
    citation: llvm/docs/LangRef.md:3674-3690@llvmorg-23.1.0, "A module may specify a target triple string that describes the target host" and the canonical forms ARCHITECTURE-VENDOR-OPERATING_SYSTEM and ARCHITECTURE-VENDOR-OPERATING_SYSTEM-ENVIRONMENT
    confidence: cited

  - id: sizes-are-settled-by-the-front-end
    claim: sizeof(long) is 8 on the two 64 bit targets and 4 on thumb and wasm, sizeof(void *) follows, and struct { char; long; } is 16 bytes aligned to 8 on the first two and 8 aligned to 4 on the other two. All four are constants in the IR before any pass runs, because the front end folded them.
    evidence: cell what_the_layout_says
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same four packed constants on both
    confidence: observed

  - id: there-are-no-c-types-in-the-ir
    claim: A function declared to take and return long compiles to one taking and returning i64 on x86_64 and aarch64 and i32 on thumbv7m and wasm32. The C type does not survive into the IR; only a width does.
    evidence: cell what_the_layout_says
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, i64 twice then i32 twice on both
    confidence: observed

  - id: the-calling-convention-is-in-the-signature
    claim: A struct of two ints passed by value becomes a single i64 parameter on x86_64 and aarch64, a [2 x i32] on thumbv7m, and a ptr noundef byval(%struct.Pair) on wasm32. A struct of four doubles becomes ptr byval on x86_64 and wasm32 and [4 x double] alignstack(8) on aarch64. The named struct type survives only where the argument is passed in memory.
    evidence: cell the_abi_is_in_the_signature
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same eight signatures on both
    confidence: observed

  - id: the-pipeline-differs-by-target
    claim: default<O2> as opt builds it has 120 entries and 4791 characters for a module whose triple is aarch64-unknown-linux-gnu, and 119 entries and 4770 characters for x86_64-unknown-linux-gnu, thumbv7m-none-eabi and wasm32-unknown-unknown. All four numbers come out of one binary on one host.
    evidence: cell the_pipeline_is_not_portable
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, all four counts reproduced on each host
    confidence: observed

  - id: the-difference-is-one-pass
    claim: Taking the multiset of pass names in each string and subtracting gives loop-idiom-vectorize once on the aarch64 side and nothing on the x86_64 side. It is not a reordering and not a repetition count, and 21 characters is the length of the name plus the separating comma.
    evidence: cell the_pipeline_is_not_portable
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same one element difference on both
    confidence: observed

  - id: this-explains-the-earlier-pairs
    claim: The pair of numbers recorded in every claims file from T05 onward, 120 against 119 entries and 4791 against 4770 characters, is a difference between the aarch64 and x86_64 targets and not between macOS and Linux or between two LLVM builds.
    evidence: cell the_pipeline_is_not_portable
    citation: the four target measurements above reproduce both members of the pair on each host, and the earlier lessons compiled for the host in each case, macOS arm64 giving the aarch64 numbers and Linux x86_64 the x86_64 ones
    confidence: inferred

  - id: a-missing-backend-falls-back
    claim: opt can only apply a target's callbacks if that target was built into it. A build without the ARM backend prints "failed to create target machine for 'thumbv7m-unknown-none-eabi'" on stderr for the thumb module and builds the generic 119 entry pipeline instead. The Homebrew build has every target and prints nothing.
    evidence: cell the_pipeline_is_not_portable
    citation: measured on Linux x86_64 with the min bundle's own opt from llvmorg-23.1.0, which warns for thumbv7m, and on macOS arm64 Homebrew LLVM 23.1.0, which does not. Both build 119 entries for that module, for different reasons.
    confidence: observed

  - id: the-triple-alone-decides-it
    claim: Replacing only the target triple line of an x86_64 module with the aarch64 one, leaving the x86_64 data layout in place, produces the 120 entry pipeline with loop-idiom-vectorize in it. Deleting both target lines produces the 119 entry pipeline.
    evidence: cell the_triple_alone
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same three outcomes on both
    confidence: observed

  - id: the-target-adds-it-at-an-extension-point
    claim: AArch64TargetMachine::registerPassBuilderCallbacks registers a late loop optimisations callback that adds LoopIdiomVectorizePass at any optimisation level other than O0. The pipeline is built with target supplied callbacks rather than being a fixed list.
    evidence: cell the_triple_alone
    citation: llvm/lib/Target/AArch64/AArch64TargetMachine.cpp:620-628@llvmorg-23.1.0, registerPassBuilderCallbacks calling PB.registerLateLoopOptimizationsEPCallback with a lambda that does LPM.addPass(LoopIdiomVectorizePass()) when Level is not OptimizationLevel::O0
    confidence: cited

  - id: what-the-extension-point-is-for
    claim: The late loop optimisations extension point is documented as the last point in the loop optimisation pipeline before loop deletion, and as the place to add passes that can remove loops, such as target-specific loop idiom recognition.
    evidence: cell the_triple_alone
    citation: llvm/include/llvm/Passes/PassBuilder.h:429-441@llvmorg-23.1.0, "This extension point allows adding late loop canonicalization and simplification passes. This is the last point in the loop optimization pipeline before loop deletion" and "This is the place to add passes that can remove loops, such as target-specific loop idiom recognition"
    confidence: cited

  - id: an-extra-pass-is-not-an-extra-transformation
    claim: All four targets optimise the counted loop to the same sixteen instructions, so the extra pass on aarch64 ran and changed nothing. The pipelines differ without the output differing for this function. The only remaining difference between the four definitions is the linkage word, dso_local on three targets and hidden on wasm32, which the front end chose.
    evidence: cell and_yet_the_body_is_the_same
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, four identical instruction lists on both
    confidence: observed
