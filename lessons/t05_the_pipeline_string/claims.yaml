# Every factual claim in this lesson, with the evidence for it.
# confidence is one of: observed, cited, inferred. At most three may be inferred.
#
# Everything marked observed was checked on two platforms, macOS arm64 with
# Homebrew LLVM 23.1.0 and Linux x86_64 running the min bundle's own clang and
# opt built from llvmorg-23.1.0. Every number below is the same on both except
# the length of the -O2 pipeline text, which is target dependent and is noted
# where it appears.
claims:
  - id: order-changes-the-result
    claim: sroa,indvars,loop-deletion leaves sum_to with the entry block and for.end and no loop, while sroa,loop-deletion,indvars leaves all five blocks and the loop intact. Neither is an error.
    evidence: cell same_names_new_order
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, 9 instructions in 2 blocks against 12 in 5 on both
    confidence: observed

  - id: loop-deletion-needs-indvars-first
    claim: loop-deletion eliminates loops with a computable trip count that have no side effects and do not contribute to the return value, so the loop in sum_to is not dead until indvars has rewritten what comes after it. Running loop-deletion first therefore wastes it, and a pipeline entry runs once with no second chance.
    evidence: cell same_names_new_order
    citation: llvm/lib/Transforms/Scalar/LoopDeletion.cpp:9-12@llvmorg-23.1.0, "eliminating loops with non-infinite computable trip counts that have no side effects or volatile instructions, and do not contribute to the computation of the function's return value"
    confidence: cited

  - id: the-first-name-picks-the-level
    claim: opt reads the first name in a -passes list, decides which level that pass belongs to, and wraps the whole list at that level, so loop-deletion,indvars,sroa is parsed as a loop pipeline and fails with "unknown loop pass 'sroa'".
    evidence: cells the_order_that_will_not_parse and where_a_pass_lives
    citation: llvm/lib/Passes/PassBuilder.cpp:2715-2719@llvmorg-23.1.0, "If the first name isn't at the module layer, wrap the pipeline up automatically", and llvm/docs/NewPassManager.md:449-457@llvmorg-23.1.0
    confidence: cited

  - id: the-message-comes-from-the-parser
    claim: The message is produced by the pipeline parser rather than by any pass, and there is one per level, so the wording tells you which level opt had settled on.
    evidence: cell where_a_pass_lives
    citation: llvm/lib/Passes/PassBuilder.cpp:2553@llvmorg-23.1.0 for the loop wording and llvm/lib/Passes/PassBuilder.cpp:2486@llvmorg-23.1.0 for the function wording
    confidence: cited

  - id: nesting-goes-one-way
    claim: The levels nest as module, then optionally call graph component, then function, then loop. A list may go from a wider level to a narrower one and never back, which is why globaldce,instcombine runs and instcombine,globaldce does not.
    evidence: cell where_a_pass_lives
    citation: llvm/docs/NewPassManager.md:445@llvmorg-23.1.0, "The nesting is: module (-> cgscc) -> function -> loop, where the CGSCC nesting is optional"
    confidence: cited

  - id: adaptors-are-inserted-per-name
    claim: A narrower pass named in a wider list is wrapped in an adaptor, and each name gets its own, so globaldce,instcombine,loop-deletion becomes globaldce, then function(instcombine), then a separate function(loop(loop-deletion)).
    evidence: cell print_the_pipeline
    citation: llvm/docs/NewPassManager.md:459-465@llvmorg-23.1.0 and llvm/lib/Passes/PassBuilder.cpp:2173@llvmorg-23.1.0
    confidence: cited

  - id: grouping-beats-a-flat-list
    claim: Two adaptors mean two walks over the functions of the module, and one pass manager holding both passes means one walk that runs both on each function. Upstream recommends the grouped form for cache locality and says it can change the quality of the optimisation.
    evidence: cell print_the_pipeline
    citation: llvm/docs/NewPassManager.md:112-140@llvmorg-23.1.0
    confidence: cited

  - id: opt-adds-verify-and-defaults
    claim: The pipeline opt builds from -passes=sroa is function(sroa<modify-cfg>),verify, so the printed form shows the adaptor, the pass parameters filled in with their defaults, and a verify run that opt appends.
    evidence: cell print_the_pipeline
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, byte identical on both
    confidence: observed

  - id: o2-is-a-pipeline-string
    claim: default<O2> prints as a single pipeline text of about 4800 characters. The exact length and entry count are target dependent, 4791 characters and 120 entries on macOS arm64 and 4770 and 119 on Linux x86_64, which is why the lesson prints them rather than stating them.
    evidence: cell the_o2_string
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0
    confidence: observed

  - id: the-printed-pipeline-round-trips
    claim: Feeding the printed default<O2> text back to -passes= produces byte identical IR to running default<O2> by name, and opt checks this itself by building a pipeline from the text before printing it.
    evidence: cell feed_it_back
    citation: llvm/tools/opt/NewPMDriver.cpp:171-176@llvmorg-23.1.0, the -disable-pipeline-verification flag whose description is that it "Disables verifying that the textual pipeline generated by -print-pipeline-passes can be used to create a pipeline"
    confidence: cited

  - id: simplifycfg-runs-eight-times
    claim: simplifycfg appears eight times in default<O2> with five distinct sets of options. Seven of the eight are given keep-loops, three are given switch-to-arithmetic, and exactly one, the seventh, is given switch-to-lookup.
    evidence: cell eight_simplifycfgs
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, the same eight instances in the same positions on both
    confidence: observed

  - id: one-option-builds-the-table
    claim: On a six case switch, simplifycfg<no-switch-to-lookup> leaves the switch and its arms, and simplifycfg<switch-to-lookup> produces a private constant array named @switch.table.pick and a function that is a range check and a load.
    evidence: cell one_option_one_table
    citation: measured on macOS arm64 LLVM 23.1.0 and Linux x86_64 LLVM 23.1.0, 23 instructions and no global against 11 and one on both
    confidence: observed
