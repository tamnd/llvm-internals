name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes anything. Set at the top so a job that gets
# added later has to ask for a permission out loud rather than inheriting one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The prose rules from CONTRIBUTING.md that a machine can check. Standard
  # library Python and no install step, because a lint that takes ninety seconds
  # to set up is a lint people stop running locally.
  prose:
    name: prose rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/prosecheck.py .
      # Same shape of check and the same reason for living next door to it: a
      # claim that names a renamed cell, or carries a tag from before the last
      # pin bump, is wrong in a way nothing else in this workflow would notice.
      # The half that needs an llvm-project checkout is the refcheck-src job.
      - run: python tools/refcheck.py

  # The linter, with its rules in ruff.toml so this job and your machine agree.
  # Separate from `prose` because it needs an install and that job deliberately
  # does not, and separate from `build` because a lint failure and a stale
  # notebook are different problems and should not queue behind each other.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Pinned, because a linter that updates itself turns an unrelated pull
          # request red on a rule nobody in it has heard of. ruff.toml carries a
          # floor as well, so a local ruff that is too old says so.
          version: "0.16.5"
          args: check --output-format github

  # Every citation that names a file and a line range, resolved against the
  # tree it claims to be quoting. The rest of refcheck runs in `prose` with no
  # checkout at all; this is the half that can tell you a path has moved or a
  # line range now runs off the end of the file, which is the failure mode a
  # pinned citation exists to prevent and the one no amount of local care
  # catches after somebody bumps the pin.
  #
  # A depth 1 clone of the one tag. Nothing here reads history, and the full
  # history of llvm-project is tens of gigabytes. A blob filter would not help:
  # checking out the tree needs every blob at that tag anyway, so it would fetch
  # the same bytes one round trip at a time.
  refcheck-src:
    name: citations resolve against the pinned tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: check out the pinned llvm-project
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("docs/pin.json"))["tag"])')
          git clone --quiet --depth 1 --branch "$tag" \
            https://github.com/llvm/llvm-project.git "$RUNNER_TEMP/llvm-project"
      - run: python3 tools/refcheck.py --llvm-src "$RUNNER_TEMP/llvm-project"

  # A committed notebook has to be exactly what its lesson source produces.
  # Without this job the whole "notebooks are build output" rule is a convention
  # people follow until the first hurry, and then it is nothing.
  build:
    name: notebooks match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Only needed by the one test that executes a notebook for real. The rest
      # of the suite runs on a bare interpreter, which is what a contributor
      # fixing a typo should need.
      - run: pip install --quiet nbconvert ipykernel
      - run: python3 -m unittest discover -s tests -v
      - run: python3 build.py check
      # Diagrams are generated too, and a diagram that no longer matches the
      # script that drew it is the same class of problem as a stale notebook.
      - run: python3 build.py diagrams
      - name: diagrams are up to date
        run: git diff --exit-code -- docs/diagrams

  # The toolkit against a real LLVM. Half of irx is about what happens when a
  # tool fails or the version is wrong, and none of that is worth testing with a
  # mock, so this job installs the pinned major version and runs the binaries.
  # The version comes out of docs/pin.json rather than being typed here, so
  # moving the pin moves this job with it.
  toolkit:
    name: irx against a real LLVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the pinned LLVM
        run: |
          set -euo pipefail
          major=$(python3 -c 'import json; print(json.load(open("docs/pin.json"))["tag"].removeprefix("llvmorg-").split(".")[0])')
          codename=$(lsb_release -cs)
          echo "IRX_LLVM_BIN=/usr/lib/llvm-$major/bin" >> "$GITHUB_ENV"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          # llvm-N is tools only. The headers a pass plugin compiles against are
          # in llvm-N-dev, and llvm-config points at them either way, so leaving
          # it out gets you a confident -I at a directory that is not there.
          # zstd is how the min bundle is packed, and tests/test_unpack.py
          # skips itself without it. A skip fails this job by design, but it
          # would fail as a mystery, so ask for the package by name.
          sudo apt-get install -y --no-install-recommends \
            "clang-$major" "llvm-$major" "llvm-$major-dev" zstd
      - name: the pin and the toolkit copy of it agree
        run: python3 -m unittest tests.test_pin -v
      # A skip would mean the install above quietly did not work, and the suite
      # would sit there green while testing none of the interesting half, so a
      # skip fails the job. tools/skipcheck.sh has the one exception, which is
      # Alive2 and goes away with issue #3.
      - name: run the toolkit tests, and insist none of them skip
        working-directory: toolkit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee "$RUNNER_TEMP/result.txt"
          bash "$GITHUB_WORKSPACE/tools/skipcheck.sh" "$RUNNER_TEMP/result.txt"
      # Boss fight graders, which need opt, clang and lli, so they run here
      # rather than in the build job. Same rule about skips: a grader test that
      # skipped looks exactly like one that passed.
      - name: every boss fight grader, against answers that work and answers that do not
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_graders -v 2>&1 | tee "$RUNNER_TEMP/graders.txt"
          bash tools/skipcheck.sh "$RUNNER_TEMP/graders.txt"

  # Every lesson executed top to bottom from a cold kernel, against a real
  # LLVM. `build.py check` two jobs up proves a notebook matches its source; it
  # says nothing about whether the notebook works, and a lesson whose third cell
  # raises is worse than one that is out of date, because the reader hitting it
  # has no way to tell whose fault it is.
  #
  # Fast is relative and means about three minutes rather than about an hour.
  # The `notebooks` job listed at the bottom is the slow one: it adds the E1
  # lessons, which need a build tree, and the Alive2 lessons, which need the
  # correctness bundle from issue #3.
  notebooks-fast:
    name: every lesson runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Same install as the toolkit job, and for the same reason: these lessons
      # print what LLVM printed, so there is nothing here to test without it.
      - name: install the pinned LLVM
        run: |
          set -euo pipefail
          major=$(python3 -c 'import json; print(json.load(open("docs/pin.json"))["tag"].removeprefix("llvmorg-").split(".")[0])')
          codename=$(lsb_release -cs)
          echo "IRX_LLVM_BIN=/usr/lib/llvm-$major/bin" >> "$GITHUB_ENV"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "clang-$major" "llvm-$major" "llvm-$major-dev"
      - run: pip install --quiet nbconvert ipykernel ./toolkit
      # x03 is skipped by name rather than by a filter, so this line has to be
      # deleted when the bundle lands and nobody can forget it is here.
      - name: run every lesson from a cold kernel
        run: python3 build.py run --skip x03_your_first_fold

  # Workflow files get the same treatment as everything else here. actionlint
  # catches the shell and expression mistakes, zizmor catches the security ones,
  # and the reason both run is that a workflow is the part of a repository
  # nobody reviews carefully and the part that holds a token.
  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Findings are the point of running this, so a finding fails the run
          # rather than filing a code scanning alert nobody opens.
          advanced-security: false
          persona: pedantic

  # Every link in the repository, resolved. This project's entire pitch is that
  # a reader can go and check, so a dead link is a broken promise rather than a
  # cosmetic problem.
  links:
    name: every link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d --accept 200,206,429 .
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The jobs below do not exist yet and are listed here rather than in a
  # planning document so that whoever adds one can see where it goes.
  #
  #   notebooks       the slow half of notebooks-fast: the E1 lessons, which
  #                   need a build tree, and the Alive2 ones, which need the
  #                   correctness bundle
  #   site            mkdocs build, and mike deploying a version on a tag
  #   alive           every pass blueprint's refinement obligation, over the
  #                   corpus, which is the job that makes the central claim real
  #   blueprints      bpc regenerates and the generated sections match
  #   toolchain       builds the five LLVM configurations from the pin and
  #                   publishes sizes and digests
  #   colab-image     nightly, runs every notebook from its badge URL in a
  #                   Colab equivalent container
  #
  # They arrive with M0 and M4. See ROADMAP.md.
