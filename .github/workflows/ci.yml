name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes anything. Set at the top so a job that gets
# added later has to ask for a permission out loud rather than inheriting one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The prose rules from CONTRIBUTING.md that a machine can check. Standard
  # library Python and no install step, because a lint that takes ninety seconds
  # to set up is a lint people stop running locally.
  prose:
    name: prose rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/prosecheck.py .

  # A committed notebook has to be exactly what its lesson source produces.
  # Without this job the whole "notebooks are build output" rule is a convention
  # people follow until the first hurry, and then it is nothing.
  build:
    name: notebooks match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Only needed by the one test that executes a notebook for real. The rest
      # of the suite runs on a bare interpreter, which is what a contributor
      # fixing a typo should need.
      - run: pip install --quiet nbconvert ipykernel
      - run: python3 -m unittest discover -s tests -v
      - run: python3 build.py check
      # Diagrams are generated too, and a diagram that no longer matches the
      # script that drew it is the same class of problem as a stale notebook.
      - run: python3 build.py diagrams
      - name: diagrams are up to date
        run: git diff --exit-code -- docs/diagrams

  # The toolkit against a real LLVM. Half of irx is about what happens when a
  # tool fails or the version is wrong, and none of that is worth testing with a
  # mock, so this job installs the pinned major version and runs the binaries.
  # The version comes out of docs/pin.json rather than being typed here, so
  # moving the pin moves this job with it.
  toolkit:
    name: irx against a real LLVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install the pinned LLVM
        run: |
          set -euo pipefail
          major=$(python3 -c 'import json; print(json.load(open("docs/pin.json"))["tag"].removeprefix("llvmorg-").split(".")[0])')
          codename=$(lsb_release -cs)
          echo "IRX_LLVM_BIN=/usr/lib/llvm-$major/bin" >> "$GITHUB_ENV"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          # llvm-N is tools only. The headers a pass plugin compiles against are
          # in llvm-N-dev, and llvm-config points at them either way, so leaving
          # it out gets you a confident -I at a directory that is not there.
          sudo apt-get install -y --no-install-recommends \
            "clang-$major" "llvm-$major" "llvm-$major-dev"
      - name: the pin and the toolkit copy of it agree
        run: python3 -m unittest tests.test_pin -v
      # A skip would mean the install above quietly did not work, and the suite
      # would sit there green while testing none of the interesting half, so a
      # skip fails the job.
      #
      # One exception, and it is temporary. Alive2 is not in any distribution
      # and building it takes hours, so the tests that need a real alive-tv skip
      # until the `alive` bundle is published and this job can download it. That
      # is issue #3. Any other skip still fails, and this carve out goes away
      # with the issue.
      - name: run the toolkit tests, and insist none of them skip
        working-directory: toolkit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee "$RUNNER_TEMP/result.txt"
          if grep "skipped" "$RUNNER_TEMP/result.txt" | grep -qv IRX_ALIVE_BIN; then
            echo "Something skipped, which means the pinned LLVM is not really there."
            exit 1
          fi
          if grep -q IRX_ALIVE_BIN "$RUNNER_TEMP/result.txt"; then
            echo "Note: the Alive2 tests skipped, which is expected until #3 ships the bundle."
          fi
      # Boss fight graders, which need opt, clang and lli, so they run here
      # rather than in the build job. Same rule about skips: a grader test that
      # skipped looks exactly like one that passed.
      - name: every boss fight grader, against answers that work and answers that do not
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_graders -v 2>&1 | tee "$RUNNER_TEMP/graders.txt"
          if grep -q "skipped" "$RUNNER_TEMP/graders.txt"; then
            echo "The grader tests skipped, so no grader was actually checked."
            exit 1
          fi

  # Workflow files get the same treatment as everything else here. actionlint
  # catches the shell and expression mistakes, zizmor catches the security ones,
  # and the reason both run is that a workflow is the part of a repository
  # nobody reviews carefully and the part that holds a token.
  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Findings are the point of running this, so a finding fails the run
          # rather than filing a code scanning alert nobody opens.
          advanced-security: false
          persona: pedantic

  # Every link in the repository, resolved. This project's entire pitch is that
  # a reader can go and check, so a dead link is a broken promise rather than a
  # cosmetic problem.
  links:
    name: every link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d --accept 200,206,429 .
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The jobs below do not exist yet and are listed here rather than in a
  # planning document so that whoever adds one can see where it goes.
  #
  #   refcheck        every path:line@llvmorg-23.1.0 citation resolves and the
  #                   surrounding lines still hash to what they hashed to
  #   notebooks       every notebook runs top to bottom from a cold kernel
  #   alive           every pass blueprint's refinement obligation, over the
  #                   corpus, which is the job that makes the central claim real
  #   blueprints      bpc regenerates and the generated sections match
  #   toolchain       builds the five LLVM configurations from the pin and
  #                   publishes sizes and digests
  #   colab-image     nightly, runs every notebook from its badge URL in a
  #                   Colab equivalent container
  #
  # They arrive with M0 and M4. See ROADMAP.md.
